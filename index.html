<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Плюс 5</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow phone column; bottom tab bar; workout opens as its own screen with a rest-timer bar.
   Colours follow gym bumper plates: A red, B blue, C yellow. Ink is the only "brand" colour. */
:root{
  --bg:#EEEFEA; --surface:#FFFFFF; --sunk:#E3E5DE; --ink:#15171A; --muted:#62675F; --line:#D5D8CF;
  --a:#C8352B; --b:#2B5FC0; --c:#B97E07; --ok:#2C8550; --warn:#B4620A;
  --on-ink:#F4F5F0;
  /* deep plate colours for full-colour bands: the same in both themes, white text sits on them */
  --ha:#B02E26; --hb:#2350A8; --hc:#946404; --fig:none;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131416; --surface:#1C1E21; --sunk:#25282C; --ink:#ECEDE7; --muted:#9A9F97; --line:#2F3337;
  --a:#E8574B; --b:#5E8FF0; --c:#E3AC35; --ok:#4DB779; --warn:#E39A45; --on-ink:#131416; --fig:brightness(.9); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1C1E21; --sunk:#25282C; --ink:#ECEDE7; --muted:#9A9F97; --line:#2F3337;
  --a:#E8574B; --b:#5E8FF0; --c:#E3AC35; --ok:#4DB779; --warn:#E39A45; --on-ink:#131416; --fig:brightness(.9); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
main{max-width:560px;margin:0 auto;padding-block:18px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font:600 30px/1.05 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
h2{font:600 19px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
h3{font:600 15px/1.3 var(--f-body)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}

.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--sunk);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.wide{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--a);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--sunk)}
.pill.intro{color:var(--b)} .pill.main{color:var(--ok)} .pill.deload{color:var(--warn)}

.plate{--pc:var(--ink);width:46px;height:46px;flex:none;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;
  font:600 22px/1 var(--f-display);box-shadow:inset 0 0 0 5px rgba(0,0,0,.18), inset 0 0 0 7px rgba(255,255,255,.18)}
.plate.sm{width:30px;height:30px;font-size:14px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.dA{--pc:var(--a)} .dB{--pc:var(--b)} .dC{--pc:var(--c)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted);border-radius:10px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs svg{width:22px;height:22px}

/* today */
.next{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.next .plate{width:64px;height:64px;font-size:30px}
.weekdots{display:flex;gap:8px}
.weekdots span{flex:1;height:8px;border-radius:4px;background:var(--sunk)}
.weekdots span.on{background:var(--ink)}
.goalbar{position:relative;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.goalbar i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:5px}
.big{font:600 40px/1 var(--f-display)}
.big small{font:500 16px var(--f-body);color:var(--muted);margin-left:4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kv>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font:600 20px/1.1 var(--f-display)}
.quick{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 16px var(--f-data);min-height:44px}
.note{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}

/* program */
.weeks{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.weeks div{height:26px;border-radius:5px;display:grid;place-items:center;font:500 11px var(--f-data);color:var(--muted);background:var(--sunk)}
.weeks .intro{background:color-mix(in srgb,var(--b) 22%,var(--surface))}
.weeks .main{background:color-mix(in srgb,var(--ok) 20%,var(--surface))}
.weeks .deload{background:color-mix(in srgb,var(--warn) 24%,var(--surface))}
.weeks .cur{outline:2px solid var(--ink);color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.exlist{display:flex;flex-direction:column}
.exrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid var(--line)}
.exrow:first-child{border-top:0}
.exrow .scheme{font:600 14px var(--f-data);white-space:nowrap;text-align:right}
.exrow .sub{grid-column:1/-1;font-size:13px;color:var(--muted)}
details.tip summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::before{content:"+ ";font-family:var(--f-data)}
details.tip[open] summary::before{content:"− "}
details.tip p{font-size:14px;margin-top:6px}
.why{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin-top:6px}
.rules{display:flex;flex-direction:column;gap:14px}
.rules h3{margin-bottom:4px}
.rules ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;font-size:14px;align-items:baseline}
.swap s{color:var(--muted)}

/* workout */
.wtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px;margin-block:-18px 0;display:flex;justify-content:space-between;align-items:center}
.excard{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.excard.complete{opacity:.72}
.exhead{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:start}
.target{font:600 13px var(--f-data);white-space:nowrap}
.last{font-size:13px;color:var(--muted)}
.up{color:var(--ok);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center}
.set .n{font:500 13px var(--f-data);color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:600 18px var(--f-data);text-align:center;min-height:46px}
.set input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.set .ok{width:48px;height:46px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.set .ok svg{width:22px;height:22px;opacity:.35}
.set.done .ok{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done .ok svg{opacity:1}
.set.done input{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;font-size:11px;color:var(--muted);text-align:center}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.rest{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);color:var(--on-ink);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rest .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.rest .t{font:700 28px/1 var(--f-data);min-width:84px}
.rest .bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--on-ink) 25%,transparent);overflow:hidden}
.rest .bar i{display:block;height:100%;background:var(--on-ink);transform-origin:left}
.rest button{background:color-mix(in srgb,var(--on-ink) 16%,transparent);border:0;color:var(--on-ink);border-radius:8px;padding:8px 10px;font-weight:600;font-size:13px}
.rest.go{background:var(--ok)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{font:500 10px var(--f-data);fill:var(--muted)}
.chart-empty{background:var(--sunk);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:14px}
.mtable{width:100%;border-collapse:collapse;font-size:14px}
.mtable td{padding:8px 0;border-top:1px solid var(--line)}
.mtable tr:first-child td{border-top:0}
.mtable td.r{text-align:right;font-family:var(--f-data);white-space:nowrap}
.delta.pos{color:var(--ok)} .delta.neg{color:var(--a)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{border:0;padding:0;background:var(--sunk);border-radius:10px;overflow:hidden;aspect-ratio:3/4;position:relative;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font:500 11px var(--f-data);padding:2px 6px;border-radius:6px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.compare figure{margin:0;display:flex;flex-direction:column;gap:4px}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--sunk)}
.compare figcaption{font:500 12px var(--f-data);color:var(--muted)}
select.exsel{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:500 15px var(--f-body);min-height:44px}

/* journal */
.wk{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.wk>button.head{border:0;background:none;padding:0;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.wk .meta{font-size:13px;color:var(--muted)}
.wk .detail{display:flex;flex-direction:column;gap:6px;font-size:14px}
.wk .detail div{display:grid;grid-template-columns:1fr auto;gap:10px}
.wk .detail .s{font-family:var(--f-data);font-size:13px;text-align:right}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs figure{margin:0;width:84px;display:flex;flex-direction:column;gap:4px}
.thumbs img{width:84px;height:112px;object-fit:cover;border-radius:8px;background:var(--sunk)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100% - 32px)}
.banner{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
/* ---- v2: illustrations, hero bands, exercise checks ---- */
.hA{--h:var(--ha)} .hB{--h:var(--hb)} .hC{--h:var(--hc)}
.hero{position:relative;overflow:hidden;border-radius:20px;padding:18px;color:#fff;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.18),transparent 60%),var(--h)}
.hero>*{position:relative}
.hero .ghostL{position:absolute;right:-26px;bottom:-70px;font:600 260px/1 var(--f-display);color:rgba(255,255,255,.1);pointer-events:none;user-select:none}
.hero .eyebrow{color:rgba(255,255,255,.78)}
.hero .htitle{font:600 28px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.hero .sub{color:rgba(255,255,255,.82);font-size:13px}
.hero .hbtn{background:#fff;color:#15171A;font-size:16px;min-height:52px;border-radius:12px}
.hero .hpill{background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:2px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip figure{margin:0;flex:none;width:96px;scroll-snap-align:start;display:flex;flex-direction:column;gap:5px}
.strip img{width:96px;height:72px;object-fit:contain;background:#fff;border-radius:10px;filter:var(--fig)}
.strip figcaption{font-size:11px;line-height:1.25;color:rgba(255,255,255,.9);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.daypick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.daypick button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;text-align:left;font-size:13px;min-width:0}
.daypick span.t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.fig{background:#fff;border-radius:12px;overflow:hidden;display:block;border:0;padding:0;width:100%;cursor:zoom-in}
.fig img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:contain;filter:var(--fig)}
.thumb{width:72px;height:54px;flex:none;border-radius:10px;background:#fff;overflow:hidden;border:0;padding:0;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;filter:var(--fig)}
.exrow{grid-template-columns:72px 1fr auto;align-items:center}
.exrow .thumb{grid-row:span 2}
.exrow .sub{grid-column:2/-1}
.exrow details.sub{grid-column:1/-1}

.excheck{width:46px;height:46px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.excheck svg{width:24px;height:24px}
.excheck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.exhead2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.exhead2 .stack{gap:3px;min-width:0}
.excard.compact{flex-direction:row;align-items:center;gap:12px;opacity:1;background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.excard.compact .chead{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:flex;gap:12px;align-items:center}
.excard.compact .chead .stack{gap:2px;min-width:0}
.excard.compact .s{font:500 12px var(--f-data);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{width:44px;height:44px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font:600 13px var(--f-data)}
.whero .row{flex-wrap:nowrap}
.whero .ring b{color:#fff}
.bigfig .fig{cursor:default}
nav.tabs button[aria-current="page"] svg{background:var(--sunk);border-radius:999px;padding:3px 14px;width:52px;height:28px;box-sizing:border-box}
nav.tabs button svg{padding:3px 14px;width:52px;height:28px;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" aria-label="Разделы"></nav>
<div id="restbar"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ===================== ПРОГРАММА ===================== */
const KIND = {bb:'кг на штанге', db:'кг в одной руке', mc:'кг', cb:'кг', bw:'доп. кг'};
const INC  = {bb:2.5, db:2, mc:2.5, cb:2.5, bw:2.5};
const PROGRAM = {
  A:{name:'Грудь · плечи · трицепс', dow:'Пн', ex:[
    {id:'bench',n:'Жим штанги лёжа',k:'bb',sets:4,lo:6,hi:8,rest:150,start:40,st:'40 кг (≈80% от твоих 50)',

function suggest(ex, excludeId){
  const h = exHistory(ex.id, excludeId); const last = h[h.length-1];
  if(!last) return {w:ex.start, first:true};
  const topW = Math.max(...last.sets.map(s=>s.w));
  const top = last.sets.filter(s=>s.w===topW);
  const need = last.phase==='main' ? ex.sets : plannedSets(ex, last.phase);
  const up = last.phase!=='deload' && top.length>=need && top.every(s=>s.r>=ex.hi);
  return {w: up ? topW + INC[ex.k] : topW, up, last};
}

  const pts = bodySorted().filter(b=>b.w>0 && days(b.d,todayISO())<=35);

  const xs=pts.map(p=>days(pts[0].d,p.d)), ys=pts.map(p=>p.w), n=xs.length;
  const mx=xs.reduce((a,b)=>a+b)/n, my=ys.reduce((a,b)=>a+b)/n;
  let num=0,den=0; xs.forEach((x,i)=>{num+=(x-mx)*(ys[i]-my);den+=(x-mx)**2});
  return den? num/den*7 : null;
}

function niceStep(r,n){const raw=r/n, p=10**Math.floor(Math.log10(raw)), f=raw/p; return (f<1.5?1:f<3?2:f<7?5:10)*p}
function lineChart(pts,{goal=null,h=150,unit=''}={}){
  if(!pts.length) return '<div class="chart-empty">Пока нет записей</div>';
  const W=340,H=h,pl=36,pr=14,pt=12,pb=22;
  const xs=pts.map(p=>parseISO(p.x).getTime());
  let x0=Math.min(...xs), x1=Math.max(...xs); if(x1-x0<864e5*6){x0-=864e5*3;x1+=864e5*3}
  let ys=pts.map(p=>p.y); if(goal!=null) ys=ys.concat(goal);
  let y0=Math.min(...ys), y1=Math.max(...ys); const pad=Math.max((y1-y0)*.12,.6); y0-=pad; y1+=pad;
  const X=t=>pl+(t-x0)/(x1-x0)*(W-pl-pr), Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
  const st=niceStep(y1-y0,3); let g='';
  for(let v=Math.ceil(y0/st)*st; v<=y1; v+=st){ const y=Y(v).toFixed(1);
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${+y+3}" text-anchor="end">${fmtN(v)}</text>`; }
  if(goal!=null){ const y=Y(goal).toFixed(1); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="${W-pr}" y="${+y-5}" text-anchor="end" style="fill:var(--ink)">цель ${fmtN(goal)}</text>`; }
  const P=pts.map((p,i)=>[X(xs[i]),Y(p.y)]);
  const line=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
  const area=P.length>1?`<path d="${line}L${P[P.length-1][0].toFixed(1)} ${H-pb}L${P[0][0].toFixed(1)} ${H-pb}Z" fill="var(--ink)" opacity=".07"/>`:'';
  const dots=P.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===P.length-1?4.5:2.5}" fill="${i===P.length-1?'var(--ink)':'var(--surface)'}" stroke="var(--ink)" stroke-width="1.5"/>`).join('');
  const lx=`<text x="${pl}" y="${H-5}">${fmtD(pts[0].x)}</text>`+(pts.length>1?`<text x="${W-pr}" y="${H-5}" text-anchor="end">${fmtD(pts[pts.length-1].x)}</text>`:'');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${area}<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>${dots}${lx}</svg></div>`;
}
function sleepChart(){
  const W=340,H=120,pl=26,pr=8,pt=10,pb=20, n=14, bw=(W-pl-pr)/n;
  const map={}; S.body.forEach(b=>{if(b.sleep>0) map[b.d]=b});
  const Y=v=>pt+(1-v/10)*(H-pt-pb); let s='';
  [0,4,8].forEach(v=>{s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${v}</text>`});
  const vals=[];
  for(let i=0;i<n;i++){ const d=new Date(); d.setDate(d.getDate()-(n-1-i)); const k=iso(d), b=map[k];
    const x=pl+i*bw+2;
    if(b){ const v=Math.min(b.sleep,10); vals.push(b.sleep);
      s+=`<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${(Y(0)-Y(v)).toFixed(1)}" rx="3" fill="${b.sleep>=7?'var(--ink)':'var(--warn)'}"/>`; }
    if(i%2===0||i===n-1) s+=`<text x="${(x+(bw-4)/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${d.getDate()}</text>`;
  }
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(7)}" y2="${Y(7)}" stroke="var(--ok)" stroke-dasharray="3 3"/>`;
  return {svg:`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${s}</svg></div>`, avg: vals.length? vals.reduce((a,b)=>a+b)/vals.length : null, n:vals.length};
}

function weightAdvice(rate){
  if(rate==null) return 'Взвешивайся 2–3 раза в неделю утром, после туалета и до еды. Нормальный темп набора — 0,25–0,5 кг в неделю.';
  if(rate<0.15) return 'Вес почти стоит. Добавь один перекус в день: творог с бананом или стакан молока с ложкой арахисовой пасты. Это ещё 300–400 ккал без подсчётов.';
  if(rate<=0.6) return 'Хороший темп: при 0,25–0,5 кг в неделю растут в основном мышцы. Ничего не меняй.';
  return 'Набираешь быстрее 0,6 кг в неделю, часть уходит в жир. Убери одну сладость или фастфуд в день, белок оставь.';
}

/* ===================== ТРЕНИРОВКА ===================== */
function newWorkout(day){
  const wk=weekNo(), ph=phaseOf(wk);
  const w={id:'w'+Date.now().toString(36), date:todayISO(), ts:Date.now(), startedAt:Date.now(), lastAt:Date.now(), day, week:wk, phase:ph, done:false, items:{}};
  PROGRAM[day].ex.forEach(ex=>{
    const sg=suggest(ex); let wt=sg.w;
    if(wt!=null && ph==='deload' && ex.k!=='bw') wt=roundTo(wt*0.8, INC[ex.k]);
    w.items[ex.id]={sets:Array.from({length:plannedSets(ex,ph)},()=>({w:wt==null?'':fmtN(wt),r:'',ok:false}))};
  });
  return w;
}
function ring(done,total,stroke='#fff',track='rgba(255,255,255,.25)'){
  const r=19,c=2*Math.PI*r,p=total?done/total:0;
  return `<span class="ring" aria-label="Выполнено ${done} из ${total}"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" fill="none" stroke="${track}" stroke-width="4"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="${stroke}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/></svg><b>${done}/${total}</b></span>`;
}
function vWorkout(){
  const w=S.active, P=PROGRAM[w.day], ph=w.phase||'main';
  const main=P.ex.filter(e=>!e.opt), total=main.length, done=main.filter(e=>w.items[e.id]?.done).length;
  return `
  <div class="wtop"><button class="btn sm ghost" data-act="minimize">← Свернуть</button><span class="num muted" id="elapsed"></span></div>
  <section class="hero whero h${w.day}"><span class="ghostL" aria-hidden="true">${w.day}</span>
    <div class="row between"><div class="stack" style="gap:4px;min-width:0"><span class="eyebrow">${fmtD(w.date)} · неделя ${w.week} · ${PHASE[ph].t}</span>
      <h1 class="htitle" style="font-size:26px">${esc(P.name)}</h1></div>${ring(done,total)}</div>
    <span class="sub">${done===total?'Все упражнения выполнены. Можно заканчивать.':'Галочка у подхода — подход сделан. Круглая галочка — упражнение выполнено целиком.'}</span>
  </section>
  ${ph!=='main'?`<div class="note small">${PHASE[ph].d}</div>`:''}
  ${P.ex.map(ex=>exCard(ex,w)).join('')}
  <button class="btn primary wide" data-act="finish">${w.done?'Сохранить изменения':'Закончить тренировку'}</button>
  ${w.done?'':`<button class="link" data-act="del" data-id="${w.id}">${S.armed===w.id?'Точно удалить эту тренировку?':'Удалить тренировку'}</button>`}`;
}
function exCard(ex,w){
  const it=w.items[ex.id]||(w.items[ex.id]={sets:[]});
  const sg=suggest(ex,w.id), last=sg.last;
  const target=`${plannedSets(ex,w.phase)}×${ex.lo}–${ex.hi}`;
  const check=`<button class="excheck" data-act="exdone" data-ex="${ex.id}" aria-pressed="${!!it.done}" aria-label="${it.done?'Снять отметку':'Упражнение выполнено'}">${ICON.check}</button>`;
  if(it.done && !S.expand[ex.id]){
    const ws=workSets(it).map(s=>({w:pnum(s.w)??0,r:pnum(s.r)}));
    return `<section class="excard compact" id="ex-${ex.id}"><button class="chead" data-act="expand" data-ex="${ex.id}" aria-label="Развернуть"><span class="thumb"><img src="${IMG(ex.id)}" alt="" loading="lazy"></span>
      <span class="stack"><b style="font-size:14px">${esc(ex.n)}</b><span class="s">${ws.length?setsStr(ws):'отмечено без подходов'}</span></span></button>${check}</section>`;
  }
  let lastLine;
  if(last) lastLine=`Прошлый раз, ${fmtD(last.date)}: <span class="num">${setsStr(last.sets)}</span>${sg.up?` <span class="up">→ пора ${fmtN(sg.w)} кг</span>`:''}`;
  else lastLine=`Первый раз. Старт: ${esc(ex.st)}`;
  return `<section class="excard" id="ex-${ex.id}">
    <div class="exhead2"><div class="stack"><h3>${esc(ex.n)}${ex.opt?' <span class="muted small">(по желанию)</span>':''}</h3><span class="target">${target} · отдых ${ex.rest>=120?fmtN(ex.rest/60)+' мин':ex.rest+' с'}</span></div>${check}</div>
    <button class="fig" data-act="fig" data-id="${ex.id}" aria-label="Увеличить картинку"><img src="${IMG(ex.id)}" alt="${esc(ex.n)}" loading="lazy"></button>
    <p class="last">${lastLine}</p>
    <div class="sethead"><span>#</span><span>${KIND[ex.k]}</span><span>повторы</span><span></span></div>
    <div class="sets">${it.sets.map((s,i)=>`<div class="set${s.ok?' done':''}" data-ex="${ex.id}" data-i="${i}">
      <span class="n">${i+1}</span>
      <input id="w-${ex.id}-${i}" data-f="w" inputmode="decimal" aria-label="Вес, подход ${i+1}" placeholder="${ex.k==='bw'?'0':'кг'}" value="${esc(s.w)}">
      <input id="r-${ex.id}-${i}" data-f="r" inputmode="numeric" aria-label="Повторы, подход ${i+1}" placeholder="${ex.lo}–${ex.hi}" value="${esc(s.r)}">
      <button class="ok" data-act="ok" aria-label="Подход выполнен" aria-pressed="${s.ok}">${ICON.check}</button></div>`).join('')}</div>
    <div class="row" style="gap:6px"><button class="btn sm ghost" data-act="addset" data-ex="${ex.id}">+ подход</button>${it.sets.length?`<button class="btn sm ghost" data-act="rmset" data-ex="${ex.id}">− подход</button>`:''}</div>
    <details class="tip"><summary>Техника</summary><p>${esc(ex.tip)}</p>${ex.why?`<p class="why">${esc(ex.why)}</p>`:''}</details>
  </section>`;
}
/* таймер отдыха */
const T={end:0,total:0,fired:true,int:null};
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2)})}catch(e){}}
function startRest(sec){T.total=sec;T.end=Date.now()+sec*1000;T.fired=false;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){};tickRest()}
function tickRest(){
  const host=$('#restbar'); if(S.view!=='workout'||!T.end){host.innerHTML='';return}
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  if(!$('#rest')) host.innerHTML=`<div class="rest" id="rest"><div class="in"><span class="t" id="restT"></span><div class="bar"><i id="restF"></i></div><button data-act="rest30">+30 с</button><button data-act="restskip">Готово</button></div></div>`;
  $('#restT').textContent=left?mmss(left):'Пора!';
  $('#restF').style.transform=`scaleX(${T.total?left/T.total:0})`;
  $('#rest').classList.toggle('go',left===0);
  if(left===0&&!T.fired){T.fired=true;beep();try{navigator.vibrate?.([250,120,250])}catch(e){}}
  if(left===0&&Date.now()-T.end>20000){T.end=0;host.innerHTML=''}
}
function tickElapsed(){const el=$('#elapsed');if(!el||!S.active)return;const m=Math.floor((Date.now()-(S.active.startedAt||S.active.ts))/60000);el.textContent=S.active.done?'':`${m} мин`}
setInterval(()=>{if(S.view==='workout'){tickRest();tickElapsed()}},500);
let wakeLock=null;
async function keepAwake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.view==='workout')keepAwake(true)});

function openWorkout(w){S.active=w;S.view='workout';S.armed=null;S.expand={};render();window.scrollTo(0,0);keepAwake(true)}
function closeWorkout(){S.view=null;S.active=null;T.end=0;keepAwake(false);render();window.scrollTo(0,0)}

function openBody(d){

  const b=S.body.find(x=>x.d===d)||{d};
  S.sheet={d, photos:[...(b.photos||[])], sq:b.sq||null, busy:0};
  renderSheet(b);
}

  $('#sheet').innerHTML=`<div class="sheet" data-act="sheetbg"><div class="panel" role="dialog" aria-modal="true" aria-label="Замеры">
    <div class="row between"><h2>Замеры и фото</h2><button class="btn sm ghost" data-act="sheetclose">Закрыть</button></div>
    <div class="field"><label for="bd-date">Дата</label><input id="bd-date" type="date" value="${sh.d}" max="${todayISO()}"></div>
    <div class="grid2">
      <div class="field"><label for="bd-w">Вес, кг</label><input id="bd-w" inputmode="decimal" value="${v('w')}" placeholder="кг"></div>

    </div>

    </div>

async function compress(file){
  try{const bmp=await createImageBitmap(file);const s=Math.min(1,1400/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85))}catch(e){return file}
}
async function addPhotos(files){
  const sh=S.sheet; if(!sh||!S.assets) return;
  const keep=readSheet();
  for(const f of files){
    sh.busy++; renderSheet(keep);
    try{const blob=await compress(f);const r=await S.assets.upload(blob,{type:blob.type&&/^image\/(jpeg|png|webp|gif)$/.test(blob.type)?blob.type:'image/jpeg'});sh.photos.push(r.id)}
    catch(e){toast(e?.code==='too_large'?'Фото слишком большое':e?.code==='unsupported_type'?'Этот формат фото не подходит, нужен JPG или PNG':'Фото не загрузилось')}
    sh.busy--; renderSheet(keep);
  }
}
function readSheet(){
  const o={}; ['w','sleep',...MEAS.map(m=>m[0])].forEach(k=>{const el=$('#bd-'+k);if(el){const n=pnum(el.value);if(n!=null&&n>0)o[k]=n}}); return o;
}
async function saveBody(){
  const sh=S.sheet; const d=$('#bd-date').value||todayISO();
  const prev=S.body.find(b=>b.d===d)||{};
  const rec={d, ...readSheet()};
  if(sh.sq) rec.sq=sh.sq;
  if(sh.photos.length) rec.photos=sh.photos;
  if(d!==sh.d){ /* перенос на другую дату — объединяем */ Object.keys(prev).forEach(k=>{if(rec[k]==null)rec[k]=prev[k]}); if(prev.photos) rec.photos=[...new Set([...(prev.photos||[]),...sh.photos])]; }
  const keys=Object.keys(rec).filter(k=>k!=='d');
  if(!keys.length){ if(S.body.find(b=>b.d===d)) await remove('body/'+d); }
  else if(await write('body/'+d, rec)===false) return;
  if(d!==sh.d && S.body.find(b=>b.d===sh.d)) await remove('body/'+sh.d);
  upsertBody(rec); S.sheet=null; renderSheet(); render(); toast('Сохранено');
}
function upsertBody(rec){const i=S.body.findIndex(b=>b.d===rec.d); if(i>=0)S.body[i]=rec; else S.body.push(rec)}

function toast(t){const el=$('#toast');el.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>el.innerHTML='',2400)}
const ACT={
  tab:el=>{S.tab=el.dataset.k;lsSet('p5-tab',S.tab);S.armed=null;if(S.view==='workout')S.view=null;render();window.scrollTo(0,0)},
  start:el=>{ensureCfg();const w=newWorkout(el.dataset.day);openWorkout(w);write('workouts/'+w.id,w)},
  resume:el=>{const w=S.workouts.find(x=>x.id===el.dataset.id);if(w)openWorkout(JSON.parse(JSON.stringify(w)))},
  edit:el=>{const w=S.workouts.find(x=>x.id===el.dataset.id);if(w)openWorkout(JSON.parse(JSON.stringify(w)))},
  minimize:()=>{clearTimeout(saveT);if(S.active)write('workouts/'+S.active.id,S.active);const was=S.active;closeWorkout();if(was&&!was.done){S.tab='today';render()}},
  ok:el=>{
    const row=el.closest('.set'), w=S.active, ex=EX[row.dataset.ex], s=w.items[ex.id].sets[+row.dataset.i];
    if(!s.ok){
      if(!(pnum(s.r)>0)){const r=row.querySelector('[data-f="r"]');r.classList.remove('shake');void r.offsetWidth;r.classList.add('shake');r.focus();return}
      if(s.w===''&&ex.k==='bw')s.w='0';
      if(!(pnum(s.w)>=0)||s.w===''){const wi=row.querySelector('[data-f="w"]');wi.classList.remove('shake');void wi.offsetWidth;wi.classList.add('shake');wi.focus();return}
      s.ok=true; w.lastAt=Date.now();
      // перенести вес в следующие пустые подходы
      w.items[ex.id].sets.forEach((x,i)=>{if(i>+row.dataset.i&&!x.ok&&x.w===''){x.w=s.w}});
      if(w.items[ex.id].sets.every(x=>x.ok)){w.items[ex.id].done=true;S.expand[ex.id]=false;toast('Упражнение выполнено ✓')}
      startRest(ex.rest);
    } else {s.ok=false;w.items[ex.id].done=false}
    const y=window.scrollY; render(); window.scrollTo(0,y);
    saveActive(300);
  },
  exdone:el=>{
    const id=el.dataset.ex, ex=EX[id], it=S.active.items[id]||(S.active.items[id]={sets:[]});
    if(!it.done){
      let filled=0;
      if(!it.sets.length) it.sets.push({w:'',r:'',ok:false});
      it.sets.forEach(s=>{if(!(pnum(s.r)>0)){s.r=String(ex.lo);filled++} if(s.w===''&&ex.k==='bw')s.w='0'; s.ok=true});
      it.done=true; S.expand[id]=false; S.active.lastAt=Date.now();
      if(filled) toast(`Пустые повторы записал как ${ex.lo}. Если было больше — разверни и поправь`);
    } else { it.done=false; S.expand[id]=true; }
    const y=scrollY; render(); scrollTo(0,y); saveActive(300);
  },
  expand:el=>{S.expand[el.dataset.ex]=!S.expand[el.dataset.ex];const y=scrollY;render();scrollTo(0,y)},
  fig:el=>openFig(el.dataset.id),
  addset:el=>{const it=S.active.items[el.dataset.ex];const l=it.sets[it.sets.length-1];it.sets.push({w:l?l.w:'',r:'',ok:false});const y=scrollY;render();scrollTo(0,y);saveActive()},
  rmset:el=>{const it=S.active.items[el.dataset.ex];it.sets.pop();const y=scrollY;render();scrollTo(0,y);saveActive()},
  rest30:()=>{T.end=Math.max(T.end,Date.now())+30000;T.total+=30;T.fired=false;tickRest()},
  restskip:()=>{T.end=0;tickRest()},
  finish:async()=>{
    const w=S.active; clearTimeout(saveT);
    if(!setCount(w)&&!Object.values(w.items).some(i=>i.done)){toast('Отметь хотя бы одно упражнение или подход');return}
    if(!w.done){w.done=true;w.dur=Math.max(1,Math.round(((w.lastAt||Date.now())-(w.startedAt||w.ts))/60000))}
    const i=S.workouts.findIndex(x=>x.id===w.id); if(i>=0)S.workouts[i]=w; else S.workouts.push(w);
    await write('workouts/'+w.id,w);
    closeWorkout(); S.tab='log'; S.open={[w.id]:true}; render(); toast('Тренировка сохранена');
  },

  toggle:el=>{S.open[el.dataset.id]=!S.open[el.dataset.id];S.armed=null;const y=scrollY;render();scrollTo(0,y)},

  },
  body:el=>{openBody(el.dataset.d)},
  sq:el=>{const n=+el.dataset.n;S.sheet.sq=S.sheet.sq===n?null:n;document.querySelectorAll('[data-act="sq"]').forEach(b=>b.setAttribute('aria-pressed',S.sheet.sq===+b.dataset.n))},
  rmphoto:async el=>{const id=el.dataset.id;const keep=readSheet();if(S.armed!==id){S.armed=id;renderSheet(keep);return}

    try{await S.assets?.delete(id)}catch(e){} renderSheet(keep)},

};

/* ===================== ТЕЛЕФОН: хранение на самом устройстве ===================== */
// В телефонной версии (сайт на экране «Домой») нет хранилища Claude: записи лежат в localStorage,
// фото — в IndexedDB. Интерфейс повторяет нужную часть db/assets, так что остальной код не меняется.
const PHONE = !!window.PHONE_BUILD;
const BLOBS = {};
const PHOTO = id => PHONE ? (BLOBS[id] || '') : '/_blob/' + id;
function localDB(){
  const KEY='p5-db'; let data={};
  try{data=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){data={}}
  const subs=new Set();
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){throw {code:'quota_exceeded'}}};
  const emit=()=>subs.forEach(f=>f());
  const clone=v=>JSON.parse(JSON.stringify(v));
  const split=p=>{const [c,id]=p.split('/');return [c,id]};
  const api={
    doc(p){const [c,id]=split(p);return {
      set:async d=>{(data[c]||(data[c]={}))[id]=clone(d);persist();emit()},
      delete:async()=>{if(data[c]){delete data[c][id];persist();emit()}},
      onSnapshot(fn){const f=()=>{const v=data[c]?.[id];fn({id,exists:!!v,data:()=>v&&clone(v),metadata:{fromCache:false,hasPendingWrites:false}})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
    }},
    collection(c){return {onSnapshot(fn){const f=()=>{const o=data[c]||{};const docs=Object.keys(o).sort().map(k=>({id:k,exists:true,data:()=>clone(o[k])}));fn({docs,size:docs.length,empty:!docs.length})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}},
    dump:()=>clone(data),
    load(d){data={cfg:d.cfg||{},workouts:d.workouts||{},body:d.body||{}};persist();emit()},
  };
  return api;
}
const idb=(()=>{let o;const open=()=>o||(o=new Promise((res,rej)=>{const r=indexedDB.open('p5-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const run=(mode,f)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction('ph',mode);const r=f(t.objectStore('ph'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}));
  return {put:(k,v)=>run('readwrite',s=>s.put(v,k)),del:k=>run('readwrite',s=>s.delete(k)),
    all:()=>open().then(db=>new Promise((res,rej)=>{const out={};const r=db.transaction('ph').objectStore('ph').openCursor();r.onsuccess=()=>{const c=r.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};r.onerror=()=>rej(r.error)}))}})();
const phoneAssets={
  async upload(blob){const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await idb.put(id,blob);BLOBS[id]=URL.createObjectURL(blob);return {id,url:BLOBS[id]}},
  async delete(id){await idb.del(id);if(BLOBS[id])URL.revokeObjectURL(BLOBS[id]);delete BLOBS[id];return {deleted:true}},
};
async function exportBackup(){
  const data=S.db.dump(); data.app='plus5'; data.saved=new Date().toISOString();
  const name=`plus5-${todayISO()}.json`;
  const file=new File([JSON.stringify(data)],name,{type:'application/json'});
  try{ if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'Плюс 5 — копия'});return} }catch(e){ if(e?.name==='AbortError') return; }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function importBackup(file){
  try{const d=JSON.parse(await file.text()); if(!d||(!d.workouts&&!d.body)) throw 0;
    S.db.load(d); toast('Данные восстановлены');}catch(e){toast('Это не файл копии «Плюс 5»')}
}

/* ===================== ЗАПУСК ===================== */
function maybeRender(){ if(S.view!=='workout'&&!S.sheet) render(); }
async function init(){
  render();
  const slowT=setTimeout(()=>{if(!S.loaded){S.slow=true;maybeRender()}},10000);
  if(PHONE){ try{navigator.storage?.persist?.()}catch(e){}
    try{const all=await idb.all();Object.entries(all).forEach(([k,v])=>BLOBS[k]=URL.createObjectURL(v))}catch(e){} }
  const db=PHONE?localDB():(window.claude?.use?await window.claude.use('db'):null);
  if(!db){S.offline=true;S.loaded=true;clearTimeout(slowT);maybeRender();return}
  S.db=db;
  const done=()=>{if(S.ready.cfg&&S.ready.w&&S.ready.b&&!S.loaded){S.loaded=true;S.slow=false;clearTimeout(slowT)}maybeRender()};
  const fail=e=>{S.offline=e?.code==='revoked'||e?.code==='not_granted';S.loaded=true;clearTimeout(slowT);maybeRender()};
  db.doc('cfg/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.ready.cfg=true;done()},fail);
  db.collection('workouts').onSnapshot(q=>{S.workouts=q.docs.map(d=>d.data());S.ready.w=true;done()},fail);
  db.collection('body').onSnapshot(q=>{S.body=q.docs.map(d=>d.data());S.ready.b=true;done()},fail);
  (PHONE?Promise.resolve(phoneAssets):window.claude.use('assets')).then(a=>{S.assets=a;if(S.sheet&&!S.sheet.compare)renderSheet(readSheet())}).catch(()=>{});
}
init();
</script>

<script>
(() => {
  if ('serviceWorker' in navigator && location.protocol === 'https:')
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let seen = null; try { seen = localStorage.getItem('p5-inst'); } catch (e) {}
  if (standalone || seen) return;
  const el = document.getElementById('inst'), t = document.getElementById('instT');
  document.getElementById('instX').onclick = () => { el.hidden = true; try { localStorage.setItem('p5-inst', '1'); } catch (e) {} };
  const ua = navigator.userAgent;
  if (/iphone|ipad|ipod/i.test(ua)) setTimeout(() => {
    t.textContent = /CriOS|FxiOS|Telegram|Instagram/i.test(ua)
      ? 'Открой эту страницу в Safari, затем «Поделиться» → «На экран Домой».'
      : 'Нажми «Поделиться» внизу Safari, затем «На экран Домой». Записи сохраняются в телефоне.';
    el.hidden = false;
  }, 1500);
})();
</script>
